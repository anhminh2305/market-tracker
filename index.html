<form id="myForm" onsubmit="handleFormSubmit(event)">
    <input type="text" name="name" placeholder="Họ tên" required><br><br>
    <input type="email" name="email" placeholder="Email" required><br><br>
    <button type="submit">Gửi thông tin</button>
</form>

<div id="successMessage" style="display: none; color: green; margin-top: 20px;">
    <h3>Chúc mừng! Bạn đã submit form thành công.</h3>
</div>

<script>
function handleFormSubmit(event) {
    event.preventDefault(); // Chặn không cho trang web bị tải lại

    // 1. Ẩn form đi và hiện thông báo thành công lên màn hình
    document.getElementById("myForm").style.display = "none";
    document.getElementById("successMessage").style.display = "block";

    // 2. (Nâng cao cho GTM) Bắn một sự kiện lên dataLayer để GTM bắt được ngay lập tức
    window.dataLayer = window.dataLayer || [];
    window.dataLayer.push({
        'event': 'form_submit_success',
        'form_id': 'myForm'
    });
}
</script>
