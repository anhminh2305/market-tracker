<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Market Insight - Giá Vàng & Bitcoin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #020617; color: #f8fafc; }
        .glass-card { background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .btn-time { @apply px-4 py-2 rounded-xl text-sm font-semibold transition-all border border-transparent; }
        .btn-time.active { @apply bg-blue-600 text-white border-blue-400 shadow-lg shadow-blue-900/20; }
        .btn-time:not(.active) { @apply bg-slate-800/50 text-slate-400 hover:bg-slate-700; }
        canvas { width: 100% !important; height: 100% !important; }
    </style>
</head>
<body class="min-h-screen p-4 md:p-10">

    <header class="max-w-6xl mx-auto flex flex-col md:flex-row justify-between items-center mb-10 gap-6">
        <div>
            <h1 class="text-4xl font-extrabold bg-clip-text text-transparent bg-gradient-to-r from-amber-400 via-orange-400 to-blue-500">
                AI Market Tracker
            </h1>
            <p class="text-slate-400 mt-1">Phân tích đa khung thời gian bởi Gemini AI</p>
        </div>
        <button onclick="refreshData()" id="refreshBtn" class="px-8 py-3 bg-blue-600 hover:bg-blue-500 rounded-2xl transition-all font-bold flex items-center gap-2 shadow-xl shadow-blue-900/30">
            <span id="refreshIcon">🔄</span> Cập nhật dữ liệu
        </button>
    </header>

    <main class="max-w-6xl mx-auto space-y-8">
        <!-- Dashboard Thẻ Giá -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="glass-card rounded-[2rem] p-8 relative overflow-hidden group">
                <div class="absolute -right-4 -top-4 opacity-5 group-hover:opacity-10 transition-all duration-500 rotate-12">
                    <svg class="w-40 h-40 text-amber-500" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14l-5-4.87 6.91-1.01L12 2z"/></svg>
                </div>
                <h3 class="text-amber-500 font-bold uppercase tracking-widest text-xs mb-4">Vàng Thế Giới (Spot)</h3>
                <div class="flex items-baseline gap-2">
                    <span id="goldPrice" class="text-5xl font-black tabular-nums">--</span>
                    <span class="text-slate-500 font-bold">USD</span>
                </div>
                <div id="goldStatus" class="mt-4 text-sm text-green-400 font-medium">--</div>
            </div>

            <div class="glass-card rounded-[2rem] p-8 relative overflow-hidden group">
                <div class="absolute -right-4 -top-4 opacity-5 group-hover:opacity-10 transition-all duration-500 rotate-12">
                    <svg class="w-40 h-40 text-blue-500" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2c5.52 0 10 4.48 10 10s-4.48 10-10 10S2 17.52 2 12 6.48 2 12 2zm3.5 11.5c.83 0 1.5-.67 1.5-1.5s-.67-1.5-1.5-1.5-1.5.67-1.5 1.5.67 1.5 1.5 1.5zm-7 0c.83 0 1.5-.67 1.5-1.5s-.67-1.5-1.5-1.5-1.5.67-1.5 1.5.67 1.5 1.5 1.5zm3.5 3c2.33 0 4.31-1.46 5.11-3.5H6.89c.8 2.04 2.78 3.5 5.11 3.5z"/></svg>
                </div>
                <h3 class="text-blue-400 font-bold uppercase tracking-widest text-xs mb-4">Bitcoin (BTC)</h3>
                <div class="flex items-baseline gap-2">
                    <span id="btcPrice" class="text-5xl font-black tabular-nums">--</span>
                    <span class="text-slate-500 font-bold">USD</span>
                </div>
                <div id="btcStatus" class="mt-4 text-sm text-blue-400 font-medium">--</div>
            </div>
        </div>

        <!-- Biểu đồ -->
        <div class="glass-card rounded-[2.5rem] p-8">
            <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 gap-4">
                <h3 class="text-xl font-bold flex items-center gap-2">
                    📊 Biểu đồ xu hướng (Cập nhật 2026)
                </h3>
                <div class="flex bg-slate-900/50 p-1.5 rounded-2xl gap-1">
                    <button onclick="changeTimeframe('7d')" class="btn-time active" id="btn-7d">7N</button>
                    <button onclick="changeTimeframe('1m')" class="btn-time" id="btn-1m">1T</button>
                    <button onclick="changeTimeframe('1y')" class="btn-time" id="btn-1y">1N</button>
                    <button onclick="changeTimeframe('10y')" class="btn-time" id="btn-10y">10N</button>
                </div>
            </div>
            <div class="h-[450px] w-full">
                <canvas id="marketChart"></canvas>
            </div>
        </div>

        <!-- Analysis Section -->
        <section class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <div class="glass-card rounded-3xl p-8 border-t-4 border-amber-500">
                <h4 class="text-amber-500 font-bold flex items-center gap-2 mb-6 uppercase tracking-wider text-sm">
                    ✨ Phân tích Vàng
                </h4>
                <div id="goldAnalysis" class="text-slate-300 leading-relaxed space-y-4">
                    <div class="animate-pulse bg-slate-800 h-20 w-full rounded-xl"></div>
                </div>
            </div>

            <div class="glass-card rounded-3xl p-8 border-t-4 border-blue-500">
                <h4 class="text-blue-400 font-bold flex items-center gap-2 mb-6 uppercase tracking-wider text-sm">
                    ✨ Phân tích Bitcoin
                </h4>
                <div id="btcAnalysis" class="text-slate-300 leading-relaxed space-y-4">
                    <div class="animate-pulse bg-slate-800 h-20 w-full rounded-xl"></div>
                </div>
            </div>
        </section>
    </main>

    <script>
        let myChart;
        const apiKey = "AIzaSyBJUiglVrP50FvC-YmCgNSTVp0ztX7CvPo"; // API Key sẽ được hệ thống cung cấp tự động
        let currentPeriod = '7d';

        // Hệ thống lấy nhãn thời gian thực tế
        const getLabels = (period) => {
            const now = new Date();
            const labels = [];
            
            if (period === '10y') {
                const currentYear = now.getFullYear();
                for (let i = 9; i >= 0; i--) {
                    labels.push((currentYear - i).toString());
                }
            } else if (period === '1y') {
                const months = ['T1', 'T2', 'T3', 'T4', 'T5', 'T6', 'T7', 'T8', 'T9', 'T10', 'T11', 'T12'];
                for (let i = 11; i >= 0; i--) {
                    const d = new Date();
                    d.setMonth(now.getMonth() - i);
                    labels.push(months[d.getMonth()]);
                }
            } else if (period === '1m') {
                for (let i = 29; i >= 0; i--) {
                    const d = new Date();
                    d.setDate(now.getDate() - i);
                    labels.push(d.getDate() + "/" + (d.getMonth() + 1));
                }
            } else {
                const days = ['CN', 'T2', 'T3', 'T4', 'T5', 'T6', 'T7'];
                for (let i = 6; i >= 0; i--) {
                    const d = new Date();
                    d.setDate(now.getDate() - i);
                    labels.push(days[d.getDay()]);
                }
            }
            return labels;
        };

        const getHistoryData = (period) => {
            let goldBase, btcBase, volatility, count;
            const labels = getLabels(period);
            count = labels.length;
            
            switch(period) {
                case '10y': goldBase = 1250; btcBase = 450; volatility = 0.5; break;
                case '1y': goldBase = 2050; btcBase = 35000; volatility = 0.25; break;
                case '1m': goldBase = 2300; btcBase = 62000; volatility = 0.08; break;
                default: goldBase = 2400; btcBase = 66000; volatility = 0.03; break;
            }

            const goldData = [];
            const btcData = [];
            
            for (let i = 0; i < count; i++) {
                const trend = 1 + (i / count) * (volatility * 4);
                const randomFactor = 1 + (Math.random() - 0.5) * volatility;
                goldData.push(Math.round(goldBase * trend * randomFactor));
                btcData.push(Math.round(btcBase * Math.pow(trend, 2.5) * randomFactor));
            }
            return { labels, goldData, btcData };
        };

        const updateChart = (period) => {
            const data = getHistoryData(period);
            myChart.data.labels = data.labels;
            myChart.data.datasets[0].data = data.goldData;
            myChart.data.datasets[1].data = data.btcData;
            myChart.update('active');
        };

        const initChart = () => {
            const ctx = document.getElementById('marketChart').getContext('2d');
            const data = getHistoryData('7d');
            
            myChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: data.labels,
                    datasets: [
                        {
                            label: 'Vàng (USD)',
                            data: data.goldData,
                            borderColor: '#fbbf24',
                            borderWidth: 3,
                            pointRadius: 2,
                            pointHoverRadius: 6,
                            tension: 0.4,
                            fill: true,
                            backgroundColor: 'rgba(251, 191, 36, 0.05)'
                        },
                        {
                            label: 'Bitcoin (USD)',
                            data: data.btcData,
                            borderColor: '#3b82f6',
                            borderWidth: 3,
                            pointRadius: 2,
                            pointHoverRadius: 6,
                            tension: 0.4,
                            fill: true,
                            backgroundColor: 'rgba(59, 130, 246, 0.05)',
                            yAxisID: 'y1'
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: { mode: 'index', intersect: false },
                    plugins: { 
                        legend: { display: true, labels: { color: '#94a3b8', usePointStyle: true } },
                        tooltip: { backgroundColor: '#0f172a', titleColor: '#fff', bodyColor: '#cbd5e1', borderColor: '#334155', borderWidth: 1 }
                    },
                    scales: {
                        y: { display: true, grid: { color: 'rgba(255,255,255,0.03)' }, ticks: { color: '#64748b' }, title: { display: true, text: 'Vàng (USD)', color: '#fbbf24' } },
                        y1: { position: 'right', display: true, grid: { drawOnChartArea: false }, ticks: { color: '#64748b' }, title: { display: true, text: 'BTC (USD)', color: '#3b82f6' } },
                        x: { grid: { display: false }, ticks: { color: '#64748b' } }
                    }
                }
            });
        };

        function changeTimeframe(period) {
            document.querySelectorAll('.btn-time').forEach(b => b.classList.remove('active'));
            document.getElementById(`btn-${period}`).classList.add('active');
            currentPeriod = period;
            updateChart(period);
        }

        async function fetchMarketData() {
            const btn = document.getElementById('refreshBtn');
            const goldAnalysisArea = document.getElementById('goldAnalysis');
            const btcAnalysisArea = document.getElementById('btcAnalysis');
            
            btn.disabled = true;
            btn.innerHTML = "⏳ AI đang quét...";

            const userQuery = `Cung cấp giá vàng spot (USD/oz) và Bitcoin (USD) mới nhất ngày hôm nay trong năm 2026. Phân tích xu hướng bằng tiếng Việt dưới dạng JSON: {"gold": number, "btc": number, "gold_analysis": "string", "btc_analysis": "string"}`;
            const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;

            // Exponential Backoff Retry Logic
            const fetchWithRetry = async (url, options, retries = 5, backoff = 1000) => {
                for (let i = 0; i < retries; i++) {
                    try {
                        const response = await fetch(url, options);
                        if (!response.ok) {
                            const errorData = await response.json();
                            throw new Error(errorData.error?.message || `HTTP error! status: ${response.status}`);
                        }
                        return await response.json();
                    } catch (err) {
                        if (i === retries - 1) throw err;
                        await new Promise(resolve => setTimeout(resolve, backoff * Math.pow(2, i)));
                    }
                }
            };

            try {
                const data = await fetchWithRetry(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: userQuery }] }],
                        generationConfig: { 
                            responseMimeType: "application/json",
                            responseSchema: {
                                type: "OBJECT",
                                properties: {
                                    gold: { type: "number" },
                                    btc: { type: "number" },
                                    gold_analysis: { type: "string" },
                                    btc_analysis: { type: "string" }
                                }
                            }
                        }
                    })
                });

                if (!data.candidates?.[0]?.content?.parts?.[0]?.text) {
                    throw new Error("Không nhận được dữ liệu hợp lệ từ AI.");
                }

                const result = JSON.parse(data.candidates[0].content.parts[0].text);

                document.getElementById('goldPrice').innerText = result.gold.toLocaleString();
                document.getElementById('btcPrice').innerText = result.btc.toLocaleString();
                document.getElementById('goldStatus').innerText = "▲ Phân tích dựa trên thị trường 2026";
                document.getElementById('btcStatus').innerText = "▲ Chỉ số tài sản kỹ thuật số";
                
                goldAnalysisArea.innerHTML = `<p>${result.gold_analysis}</p>`;
                btcAnalysisArea.innerHTML = `<p>${result.btc_analysis}</p>`;

                const lastIdx = myChart.data.datasets[0].data.length - 1;
                myChart.data.datasets[0].data[lastIdx] = result.gold;
                myChart.data.datasets[1].data[lastIdx] = result.btc;
                myChart.update();

            } catch (error) {
                console.error("Lỗi Fetch Data:", error);
                const errorMsg = `<div class="p-4 bg-red-950/20 border border-red-500/30 rounded-xl">
                    <p class="text-red-400 font-bold mb-2">⚠️ Lỗi kết nối AI</p>
                    <p class="text-red-300/70 text-xs">${error.message}</p>
                    <p class="text-slate-400 text-xs mt-3 italic">* Vui lòng kiểm tra lại kết nối hoặc thử lại sau vài giây.</p>
                </div>`;
                goldAnalysisArea.innerHTML = errorMsg;
                btcAnalysisArea.innerHTML = errorMsg;
            } finally {
                btn.disabled = false;
                btn.innerHTML = "🔄 Cập nhật dữ liệu";
            }
        }

        function refreshData() { fetchMarketData(); }

        window.onload = () => {
            initChart();
            fetchMarketData();
        };
    </script>
</body>
</html>
